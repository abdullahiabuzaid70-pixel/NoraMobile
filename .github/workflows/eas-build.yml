name: EAS Preview Build
on:
  workflow_dispatch: {}   # manual only — avoids failing on every push without EXPO_TOKEN
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check EXPO_TOKEN is configured
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "::error::EXPO_TOKEN secret is not set. Add it in GitHub repo Settings > Secrets and variables > Actions, using a token from https://expo.dev/accounts/[your-account]/settings/access-tokens"
          exit 1
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npx eas-cli build --platform android --profile preview --non-interactive
